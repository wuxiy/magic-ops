# 生产环境配置（PostgreSQL）
server:
  port: 8080

spring:
  application:
    name: magicops-console
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:magicops}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:magicops}
    password: ${DB_PASSWORD:magicops}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

magicops:
  runtime:
    url: ${RUNTIME_URL:http://localhost:8081}

logging:
  level:
    top.cywu.magicops: INFO
    org.hibernate.SQL: WARN
