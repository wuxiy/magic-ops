server:
  port: 8080

spring:
  application:
    name: magicops-console
  datasource:
    url: jdbc:h2:mem:magicops-console;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

# magic-api 编辑器配置（Web UI 由本应用提供，认证走 SSO）
magic-api:
  web: /magic/web
  prefix: /magic-api
  resource:
    type: database
    tableName: magic_api_file
  banner: false
  show-sql: false
  security:
    username:
    password:

logging:
  level:
    top.cywu.magicops: DEBUG
