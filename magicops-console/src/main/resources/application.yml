server:
  port: 8080

spring:
  application:
    name: magicops-console
  datasource:
    url: jdbc:h2:mem:magicops-console;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  flyway:
    enabled: false
  security:
    user:
      name: admin
      password: admin

logging:
  level:
    top.cywu.magicops: DEBUG
