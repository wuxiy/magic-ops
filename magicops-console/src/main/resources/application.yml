server:
  port: 8080

spring:
  application:
    name: magicops-console
  datasource:
    url: jdbc:h2:mem:magicops-console;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

# magic-api 编辑器配置（Web UI 由本应用提供，认证走 SSO）
magic-api:
  web: /magic/web
  prefix: /magic-api
  resource:
    type: database
    tableName: magic_api_file
  banner: false
  show-sql: false
  security:
    username:
    password:

# Arthas 诊断中心 Tunnel 配置
# enabled=false 时诊断命令走模拟降级；接入真实 Arthas Tunnel Server 时启用并配置 server-url
magicops:
  # 切片 32：推送发布包到 Runtime 的共享密钥（为空时不携带认证头，仅限非生产）
  runtime:
    push-secret: ${MAGICOPS_RUNTIME_SHARED_SECRET:}
  diagnosis:
    tunnel:
      enabled: false
      server-url: ws://localhost:7777/ws/client
      client-name: magicops
      auth-token:
      connect-timeout-ms: 5000
      command-timeout-ms: 30000
      simulate-fallback: true

logging:
  level:
    top.cywu.magicops: DEBUG
