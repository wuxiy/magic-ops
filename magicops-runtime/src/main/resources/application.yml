server:
  port: 8081

spring:
  application:
    name: magicops-runtime
  datasource:
    url: jdbc:h2:mem:magicops-runtime;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 开发态由 Hibernate 按实体建表；生产态用 prod profile 的 validate 校验 Console 建好的 schema
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
  security:
    user:
      name: runtime
      password: runtime

# 发布包推送共享密钥（切片 32）。为空且非 prod 时收包端点放行并告警；prod 下 fail-closed。
magicops:
  runtime:
    push-secret: ${MAGICOPS_RUNTIME_SHARED_SECRET:}

logging:
  level:
    top.cywu.magicops: DEBUG

# 可观测：actuator 健康/指标 + Prometheus（切片 35）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
