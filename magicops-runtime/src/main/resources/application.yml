server:
  port: 8081

spring:
  application:
    name: magicops-runtime
  datasource:
    url: jdbc:h2:mem:magicops-runtime;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  security:
    user:
      name: runtime
      password: runtime

# 发布包推送共享密钥（切片 32）。为空且非 prod 时收包端点放行并告警；prod 下 fail-closed。
magicops:
  runtime:
    push-secret: ${MAGICOPS_RUNTIME_SHARED_SECRET:}

logging:
  level:
    top.cywu.magicops: DEBUG
